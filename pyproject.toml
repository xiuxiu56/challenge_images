[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge-images"
version = "0.1.0"
description = "YOLO26 图像分类训练与挑战大图网格验证工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "ultralytics",
    "Pillow",
    "PySide6",
]

[project.optional-dependencies]
test = ["pytest"]
quality = ["ruff", "mypy"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:rerunfailures"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["data", "runs", "reports", ".runtime_cache"]

[tool.mypy]
python_version = "3.10"
files = ["src/challenge_images"]
ignore_missing_imports = true

# PySide6 的类型存根没有暴露扁平枚举别名（Qt.ScrollBarAlwaysOff、
# QPlainTextEdit.NoWrap 等），但它们在运行时完全合法且是 Qt 的惯用写法。
# 改写成 Qt.ScrollBarPolicy.ScrollBarAlwaysOff 只是为了迁就存根，
# 反而降低可读性，因此在 GUI 层单独放行这一类错误。
[[tool.mypy.overrides]]
module = [
    "challenge_images.gui.qt_gui",
    "challenge_images.gui.online_data_tab",
    "challenge_images.gui.settings_tab",
    "challenge_images.gui.widgets",
]
disable_error_code = ["attr-defined"]

# Tkinter 备用界面使用可选导入降级（无 Tkinter 时把名字置为 None），
# 这种「同一名字既是类型又可为 None」的模式无法用类型系统表达。
[[tool.mypy.overrides]]
module = "challenge_images.gui.gui_app"
disable_error_code = ["index", "misc"]
